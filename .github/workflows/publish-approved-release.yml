name: Publish approved NodeWarden release

on:
  pull_request:
    types: [closed]
    branches: [release-control]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged release PR; empty initializes the baseline once, then reconciles approvals'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: nodewarden-production-release
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
      pull-requests: read
    if: >-
      github.event.repository.default_branch == 'release-control' &&
      github.ref == 'refs/heads/release-control' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release-update/') &&
        github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.event.pull_request.user.type == 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Publish one reviewed customization commit over the official release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: python
        run: |
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          revision = os.environ['TRUSTED_WORKFLOW_SHA']
          if repository.lower() != 'fenghengzhi/nodewarden' or not re.fullmatch(r'[0-9a-f]{40}', revision):
              raise RuntimeError('Invalid trusted control workflow identity')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          urllib.request.install_opener(urllib.request.build_opener(NoRedirect()))
          os.umask(0o077)
          # Load only these reviewed control scripts from the same immutable
          # commit as this workflow. Never check out or execute upstream code.
          with tempfile.TemporaryDirectory(prefix='nodewarden-control-') as directory:
              for name in ('deployment_git.py', 'publish_release.py'):
                  url = ('https://api.github.com/repos/' + repository + '/contents/.github/workflows/'
                         + name + '?' + urllib.parse.urlencode({'ref': revision}))
                  request = urllib.request.Request(url, headers={
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'nodewarden-trusted-control-loader',
                  })
                  request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
                  with urllib.request.urlopen(request, timeout=45) as response:
                      record = json.load(response)
                  if record.get('type') != 'file' or record.get('encoding') != 'base64':
                      raise RuntimeError('Control script must be an ordinary committed file')
                  source = base64.b64decode(record['content'])
                  if len(source) > 262144:
                      raise RuntimeError('Unexpected control script size')
                  (Path(directory) / name).write_bytes(source)
              subprocess.run([sys.executable, str(Path(directory) / 'publish_release.py')], check=True)
