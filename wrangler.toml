name = "nodewarden"
account_id = "8db6a57d585fbc12e9d28f3399e03e64"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = false
preview_urls = false
keep_vars = true
routes = [ { pattern = "vault.fenghengzhi.com", custom_domain = true } ]

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"
database_id = "c2e0534a-ea98-43c8-9be3-e1a2f8e8a7d9"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
