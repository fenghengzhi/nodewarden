name: Propose official NodeWarden releases

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nodewarden-release-proposals
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event.repository.default_branch == 'release-control' &&
      github.ref == 'refs/heads/release-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Propose stable releases without executing upstream code
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CONTROL_BRANCH: ${{ github.event.repository.default_branch }}
        shell: python
        run: |
          import base64
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          UPSTREAM = 'shuaiplus/nodewarden'
          BASELINE = '29c2de852411f3aa66de0c8a2ea16e7f87fa932c'
          BOOTSTRAP = 'd928f8945a9be575e7c2f899d827f20961653dc1'
          MARKER = '<!-- nodewarden-release-control-v2 -->'
          repository = os.environ['REPOSITORY']
          control = os.environ['CONTROL_BRANCH']
          if control != 'release-control' or repository.lower() == UPSTREAM:
              raise RuntimeError('Run only in the fork default branch release-control')
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise RuntimeError('Invalid fork repository name')
          root = f'repos/{repository}'
          public_root = f'repos/{UPSTREAM}'
          semver = re.compile(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)')
          sha_pattern = re.compile(r'[0-9a-f]{40}')

          class ApiError(RuntimeError):
              def __init__(self, method, path, status):
                  self.status = status
                  super().__init__(f'GitHub API {method} {path} returned HTTP {status}')

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          urllib.request.install_opener(urllib.request.build_opener(NoRedirect()))

          def api(path, *, method='GET', data=None, authenticated=False, missing_ok=False):
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'nodewarden-release-control',
              }
              if authenticated:
                  if path != root and not path.startswith(root + '/'):
                      raise RuntimeError('Authenticated API access outside this fork is forbidden')
              elif method != 'GET' or not path.startswith(public_root + '/'):
                  raise RuntimeError('Upstream API access must be public and read-only')
              body = None if data is None else json.dumps(data).encode()
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(
                  'https://api.github.com/' + path, data=body, headers=headers, method=method
              )
              # The fork-scoped token also authenticates fixed official GETs;
              # it adds no upstream write permission and is never redirected.
              request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  status = error.code
                  error.close()
                  if missing_ok and status == 404:
                      return None
                  raise ApiError(method, path, status) from None

          def own(path='', **kwargs):
              return api(root + ('/' + path if path else ''), authenticated=True, **kwargs)

          def pages(path, *, authenticated=False):
              collected = []
              for page in range(1, 11):
                  separator = '&' if '?' in path else '?'
                  batch = api(path + separator + f'per_page=100&page={page}', authenticated=authenticated)
                  if not isinstance(batch, list):
                      raise RuntimeError('Unexpected paginated API response')
                  collected.extend(batch)
                  if len(batch) < 100:
                      return collected
              raise RuntimeError('More than 1000 records; refusing to silently truncate release/PR history')

          def version_tuple(value):
              if not isinstance(value, str) or not semver.fullmatch(value):
                  raise RuntimeError('Expected stable MAJOR.MINOR.PATCH version')
              return tuple(map(int, value.split('.')))

          def resolve_tag(tag):
              target = api(public_root + '/git/ref/tags/' + urllib.parse.quote(tag, safe=''))['object']
              for _ in range(16):
                  if not sha_pattern.fullmatch(target.get('sha', '')):
                      raise RuntimeError('Invalid upstream tag object')
                  if target['type'] == 'commit':
                      return target['sha']
                  if target['type'] != 'tag':
                      raise RuntimeError('Release tag does not resolve to a commit')
                  target = api(public_root + '/git/tags/' + target['sha'])['object']
              raise RuntimeError('Too many nested annotated tags')

          def trusted_pr(pr, branch, commit):
              return (
                  pr.get('user', {}).get('login') == 'github-actions[bot]'
                  and pr.get('user', {}).get('type') == 'Bot'
                  and pr.get('head', {}).get('ref') == branch
                  and pr.get('head', {}).get('sha') == commit
                  and same_repo(pr.get('head', {}).get('repo'))
                  and pr.get('base', {}).get('ref') == control
                  and same_repo(pr.get('base', {}).get('repo'))
              )

          def same_repo(value):
              return (value or {}).get('full_name', '').lower() == repository.lower()

          def pr_body(tag, commit, current_version):
              return (
                  MARKER + '\n'
                  f'审核 NodeWarden 正式版 {tag[1:]}（当前生产版本 {current_version}）。\n\n'
                  f'- [官方发布说明](https://github.com/{UPSTREAM}/releases/tag/{tag})\n'
                  f'- [审核分支与官方更新的差异](https://github.com/{repository}/compare/{control}...release-update/{tag})\n'
                  f'- 官方标签提交／部署提交的唯一父提交：`{commit}`\n\n'
                  '请检查发布说明、`wrangler.toml`、资源绑定、迁移及构建要求。'
                  '**请使用 Create a merge commit 合并到 release-control，保留上游历史。**\n\n'
                  '合并后，独立发布工作流重新核对审批和官方标签，仅叠加已审定的部署配置与主密码政策，'
                  '生成一个确定性的定制提交，其唯一父提交就是上述官方 SHA。'
                  '该提交会归档到不可改写的 nodewarden-deploy/v版本 标签；'
                  '确认旧部署可信且已归档后，通过原子推送和明确的旧 SHA lease 更新 production。'
                  'Cloudflare 直接构建 production 中已提交的文件，不发布审核分支的合并提交。\n\n'
                  '提案工作流只创建更新分支和 PR，不修改 production，不执行上游代码，也不自动合并。'
              )

          metadata = own()
          if (not metadata.get('fork') or metadata.get('private')
                  or metadata.get('source', {}).get('full_name', '').lower() != UPSTREAM
                  or metadata.get('default_branch') != control):
              raise RuntimeError('Expected a public NodeWarden fork with default branch release-control')
          production_sha = own('git/ref/heads/production')['object']['sha']
          control_sha = own('git/ref/heads/' + control)['object']['sha']
          package_file = own('contents/package.json?' + urllib.parse.urlencode({'ref': production_sha}))
          if package_file.get('type') != 'file' or package_file.get('encoding') != 'base64':
              raise RuntimeError('production/package.json must be an ordinary JSON file')
          current_version = json.loads(base64.b64decode(package_file['content']))['version']
          current_tuple = version_tuple(current_version)

          if production_sha == BASELINE:
              production_official = BASELINE
              if current_version != '1.8.1':
                  raise RuntimeError('Unexpected transitional baseline version')
          else:
              parents = own('git/commits/' + production_sha).get('parents', [])
              if len(parents) != 1 or not sha_pattern.fullmatch(parents[0].get('sha', '')):
                  raise RuntimeError('Production must be a single-parent customized deployment commit')
              production_official = parents[0]['sha']
              archive = own('git/ref/tags/nodewarden-deploy/v' + current_version, missing_ok=True)
              if archive is None or archive.get('object', {}).get('sha') != production_sha:
                  raise RuntimeError('Production is not archived at its immutable version tag')
              if production_sha == BOOTSTRAP:
                  if current_version != '1.8.1' or production_official != BASELINE:
                      raise RuntimeError('Unexpected initial deployment identity')
              elif resolve_tag('v' + current_version) != production_official:
                  raise RuntimeError('Production parent differs from its official release tag')
          baseline = own('compare/' + BASELINE + '...' + production_official)
          if (baseline.get('status') not in ('ahead', 'identical')
                  or baseline.get('merge_base_commit', {}).get('sha') != BASELINE):
              raise RuntimeError('Production official parent must retain the intentional baseline ancestry')

          releases = pages(public_root + '/releases')
          candidates = {}
          for release in releases:
              tag = release.get('tag_name', '')
              if (release.get('draft') or release.get('prerelease') or not release.get('published_at')
                      or not isinstance(tag, str) or not tag.startswith('v') or not semver.fullmatch(tag[1:])):
                  continue
              if version_tuple(tag[1:]) > current_tuple:
                  candidates[tag] = release
          prs = pages(root + '/pulls?' + urllib.parse.urlencode({'state': 'all', 'base': control}), authenticated=True)
          processed = 0
          for tag in sorted(candidates, key=lambda value: version_tuple(value[1:])):
              branch = 'release-update/' + tag
              matches = [pr for pr in prs if pr.get('head', {}).get('ref') == branch
                         and same_repo(pr.get('head', {}).get('repo'))]
              # Respect closed/declined PRs and avoid reopening the same release.
              if any(pr.get('state') != 'open' for pr in matches):
                  continue
              legacy = [pr for pr in matches if ('合并到 production' in (pr.get('body') or '')
                        or '<!-- nodewarden-release-control-v1 -->' in (pr.get('body') or ''))
                        and MARKER not in (pr.get('body') or '')]
              if matches and not legacy:
                  continue
              if processed >= 10:
                  print('Processed ten candidates; remaining releases will be reconciled on the next run.')
                  break
              processed += 1
              commit = resolve_tag(tag)
              if matches:
                  for pr in legacy:
                      if trusted_pr(pr, branch, commit):
                          own('pulls/' + str(pr['number']), method='PATCH', data={
                              'body': pr_body(tag, commit, current_version),
                          })
                  continue
              forward = own('compare/' + production_official + '...' + commit)
              if forward.get('status') in ('behind', 'identical'):
                  continue
              if (forward.get('status') != 'ahead'
                      or forward.get('merge_base_commit', {}).get('sha') != production_official):
                  raise RuntimeError(f'{tag} does not descend from the deployed official parent; no proposal created')
              approved_history = own('compare/' + control_sha + '...' + commit)
              if approved_history.get('status') in ('behind', 'identical'):
                  print(tag + ' is already included in release-control; no duplicate proposal.')
                  continue
              if (approved_history.get('status') not in ('ahead', 'diverged')
                      or not approved_history.get('merge_base_commit', {}).get('sha')):
                  raise RuntimeError('No verified common history between control and release')
              ref_path = 'git/ref/heads/' + branch
              ref = own(ref_path, missing_ok=True)
              if ref is None:
                  try:
                      ref = own('git/refs', method='POST', data={'ref': 'refs/heads/' + branch, 'sha': commit})
                  except ApiError as error:
                      ref = own(ref_path, missing_ok=True)
                      if ref is None:
                          print(
                              f'Cannot create {branch} (HTTP {error.status}). GitHub may require Workflows '
                              'write permission unavailable to GITHUB_TOKEN, reject the shared fork commit, '
                              'or enforce branch rules. No production/control ref was changed. '
                              'Do not force-push or expand permissions automatically. An owner can prepare '
                              'this exact update branch and rerun the workflow:\n'
                              f'git fetch https://github.com/{UPSTREAM}.git tag {tag}\n'
                              f'git push origin {commit}:refs/heads/{branch}'
                          )
                          raise RuntimeError('Release branch creation requires manual attention') from None
              if ref['object']['type'] != 'commit' or ref['object']['sha'] != commit:
                  raise RuntimeError('Existing release branch differs from official tag; refusing to overwrite it')
              if (own('git/ref/heads/' + control)['object']['sha'] != control_sha
                      or own('git/ref/heads/production')['object']['sha'] != production_sha):
                  raise RuntimeError('Control or production changed; retry to reassess the release')
              own('pulls', method='POST', data={
                  'title': 'chore: update NodeWarden to ' + tag,
                  'head': branch, 'base': control, 'body': pr_body(tag, commit, current_version),
              })
              print('Created the approval PR for ' + tag + '; production is unchanged.')
